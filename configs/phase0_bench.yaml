# Phase 0: run-time estimate by population size (unconnected LIF, no synapses).
experiment: bench
seed: 0
simulators: [rate, spiking]

model:
  n_neurons: 2000          # order of magnitude of KCs per hemisphere (~2000, Aso 2014; research notes)
  tau_m_ms: 10.0           # arbitrary default (membrane time constant unverified)
  v_rest_mv: -70.0         # arbitrary default
  v_reset_mv: -70.0        # arbitrary default
  v_thresh_mv: -50.0       # arbitrary default
  refractory_ms: 2.0       # arbitrary default
  noise_sigma_mv: 2.0      # arbitrary default; noise on so the RNG cost is included
  dt_ms: 0.1               # arbitrary default (integration step)
  codegen_target: cython   # Brian2 runtime target: cython | numpy

stimulus:
  drive_range_mv: [0.0, 40.0]  # arbitrary default; threshold gap is 20 mV, so ~half are active
  duration_ms: 500.0           # arbitrary default

sizes: [100, 1000, 2000, 10000, 100000]  # 2000 ~ one-hemisphere KCs; 1e5 ~ whole-brain order
repeats: 3
