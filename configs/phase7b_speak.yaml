# Phase 7b (ADR 0012): speaking fly v0. Rate model first; spiking after a run-time estimate.
# Mushroom body, plasticity and protocol from the Zumi config (base); corpus from 7a.
experiment: speak_fly
base: configs/phase6_zumi.yaml
seed: 0
seeds: [60, 61, 62, 63, 64]             # test seeds, test split (as 7a)
select_seeds: [10, 11, 12, 13, 14]      # pn_active_frac chosen here, dev split
simulators: [rate]
workers: 10
rng_streams: {tokens: 10000, noise: 1000, corpus: 70000}

corpus:                                 # as configs/phase7a_corpus.yaml
  n_train: 2000
  n_dev: 200
  n_test: 500
  turns: 30
  n_nouns: 6
  noun_len: [3, 7]
  max_teach: 3
  p_kind: [0.25, 0.2, 0.1, 0.35, 0.1]
  p_restart: 0.05
  ring: {max_moves: 3, p_question: [0.3, 0.35, 0.35], p_suppose: 0.25}

speak:
  n_train_dialogues: 300                # 9,000 turns, ~21k dopamine-gated presentations per epoch
  epochs: 3
  n_eval_dialogues: 200
  arch: split                           # single failed on selection seed 10 (ADR 0012)
  grid: [[0.1, 450], [0.15, 450], [0.15, 650], [0.2, 650]]  # (pn_active_frac per token, rate kc_theta)
  pn_active_frac: 0.15                  # overwritten by the selection
  kc_theta: 650                         # overwritten by the selection (base: 450)
  floor: 0.001                          # next-word distribution floor (perplexity only)
  controls: [null, shuffled_teacher, no_kc, shuffled_wiring, context_table]  # context_table: ceiling, not a fly

gate:                                   # ADR 0012, set before the run
  grammatical_min: 0.95                 # every test seed
  appropriate_min: 0.95                 # every test seed
  control_appropriate_max: 0.90         # mean over test seeds, each control
