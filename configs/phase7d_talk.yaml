# Phase 7d (ADR 0012): reply content from the flies (ring, memory, comparator) over whole
# dialogues; grammar fly from 7c, speaker as 7b/7c. Nothing is tuned here.
experiment: talk
base: configs/phase6_zumi.yaml
lang_overrides: {prop_order: strict}
seed: 0
seeds: [60, 61, 62, 63, 64]
simulators: [rate]
workers: 10
rng_streams: {corpus: 70000}            # merged into the base config's streams

corpus:                                 # as 7a-7c (strict property order)
  n_train: 2000
  n_dev: 200
  n_test: 500
  turns: 30
  n_nouns: 6
  noun_len: [3, 7]
  max_teach: 3
  p_kind: [0.25, 0.2, 0.1, 0.35, 0.1]
  p_restart: 0.05
  ring: {max_moves: 3, p_question: [0.3, 0.35, 0.35], p_suppose: 0.25}

speak:                                  # as chosen in 7b
  arch: split
  pn_active_frac: 0.15
  kc_theta: 650
  n_train_dialogues: 300
  epochs: 3
  floor: 0.001

talk:
  grammar_threshold: 0.05               # chosen in 7c on seeds 10-14
  n_eval_dialogues: 200                 # 6,000 turns per seed
  controls: [null, shuffled, no_kc_memory]  # shuffled: ring, memory and comparator teachers shuffled

gate:                                   # ADR 0012, set before the run; every test seed
  exact_min: 0.95                       # whole reply = oracle
  content_exact_min: 0.95               # pooled over ask / what / where / yes-no
  appropriate_min: 0.95
  grammatical_min: 0.95
  control_content_exact_max: 0.70       # mean, each control (baselines pooled ~0.6)
