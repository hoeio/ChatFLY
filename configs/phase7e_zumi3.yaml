# Phase 7e (ADR 0012): Zumi 3, "GPT-2 level in Zumi". Pronoun `to`, one- or two-sentence fly
# replies chosen at random where several are right, every reply word sampled from the
# speaker's MBON rates. Components as in 7c/7d; nothing is tuned here.
experiment: zumi3
base: configs/phase6_zumi.yaml
lang_overrides: {prop_order: strict, pronoun: to, zumi3: true}
seed: 0
seeds: [60, 61, 62, 63, 64]
simulators: [rate]
workers: 10
rng_streams: {corpus: 70000}

zumi3:
  p_pronoun: 0.4          # a named thing is replaced by `to` (when there is a topic); arbitrary
  p_ask_back: 0.5         # after teaching: also ask about the first unknown pair; arbitrary
  p_elaborate: 0.5        # after "na": also say what is true; arbitrary
  temperature: 0.1        # sampling from normalized MBON rates (dist ** (1 / T)); chosen on select seeds 10-14 (ADR 0012, 7e)
  max_len: 10             # words per reply (longest correct reply: 8)
  jobs: [baselines, fly, shuffled, load, load_no_kc]

corpus:                   # as 7a-7d
  n_train: 2000
  n_dev: 200
  n_test: 500
  turns: 30
  n_nouns: 6
  noun_len: [3, 7]
  max_teach: 3
  p_kind: [0.25, 0.2, 0.1, 0.35, 0.1]
  p_restart: 0.05
  ring: {max_moves: 3, p_question: [0.3, 0.35, 0.35], p_suppose: 0.25}

load_corpus:              # memory load: 40 things per dialogue (Zumi 2: no-KC memory fails at 40)
  n_load: 20              # dialogues per seed
  turns: 200
  n_nouns: 40
  noun_len: [3, 7]
  max_teach: 3
  p_kind: [0.4, 0.3, 0.2, 0.05, 0.05]
  p_restart: 0.05
  ring: {max_moves: 3, p_question: [0.3, 0.35, 0.35], p_suppose: 0.25}

speak:                    # as chosen in 7b
  arch: split
  pn_active_frac: 0.15
  kc_theta: 650
  n_train_dialogues: 300
  epochs: 3
  floor: 0.001

talk:
  grammar_threshold: 0.05 # chosen in 7c
  n_eval_dialogues: 200

baselines:
  ngram_orders: [3, 5, 8]
  alpha: 0.01
  rnn: {hidden: 128, noun_dim: 32, epochs: 30, batch: 32, lr: 0.003, clip: 5.0}
  dev_dialogues: 100

gate:                     # ADR 0012 (7e), set before the run; "every seed" = each test seed
  perplexity: below every baseline's mean   # criterion 1
  grammatical_min: 0.95                     # criterion 2, sampled replies, every seed
  appropriate_min: 0.95                     # criterion 2, every seed
  exact_min: 0.95                           # criterion 3: reply is one of the correct replies, every seed
  max_len_hit_max: 0.01                     # criterion 4: no runaway replies; distinct-2 reported
  load_memory_exact_min: 0.95               # criterion 5: fly in the load condition, every seed
  control_shuffled_exact_max: 0.70          # criterion 5: mean
  control_load_no_kc_memory_exact_max: 0.90 # criterion 5: mean, memory questions only
