# Phase 8a-2 (ADR 0013), test run: does a FlyWire-sized PN layer (340 PNs) remove the
# input crowding that broke 8a's end-of-sentence context? Test seeds 80-84; the condition is set after selection.
experiment: capacity
base: configs/phase6_zumi.yaml
seed: 0
seeds: [80, 81, 82, 83, 84]
simulators: [rate]
workers: 10

capacity:
  vocab_sizes: [112]
  codings: [k2n20]                    # chosen in 8a
  conds:                              # PNs, token density, KCs, KC threshold (650: 4 of 5 claws, 850: 5 of 5)
    - {n_pn: 150, pn_active_frac: 0.15, n_kc: 16000, kc_theta: 850}   # 8a's chosen condition
    - {n_pn: 340, pn_active_frac: 0.15, n_kc: 16000, kc_theta: 850}   # 139 uni + 201 multi PNs per side (FlyWire v783)
    - {n_pn: 340, pn_active_frac: 0.1, n_kc: 16000, kc_theta: 650}
    - {n_pn: 340, pn_active_frac: 0.065, n_kc: 16000, kc_theta: 650}  # 22 PNs per token, as in 8a
    - {n_pn: 340, pn_active_frac: 0.065, n_kc: 32000, kc_theta: 650}
  controls: [no_kc, shuffled]
  n_messages: 500
