# Phase 8a-3 (ADR 0013), test run: frequency-balanced teaching of rare contexts (the end of a
# sentence) against the majority conflict seen in 8a and 8a-2. Test seeds 80-84; the condition is set after selection.
experiment: capacity
base: configs/phase6_zumi.yaml
seed: 0
seeds: [80, 81, 82, 83, 84]
simulators: [rate]
workers: 10

capacity:
  vocab_sizes: [112]
  codings: [k2n20]
    - {n_pn: 150, pn_active_frac: 0.15, n_kc: 16000, kc_theta: 850, balance: state}
  controls: [no_kc, shuffled]
  n_messages: 500
