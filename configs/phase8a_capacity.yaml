# Phase 8a (ADR 0013), test run: output capacity for a Toki Pona vocabulary. The gate is in ADR 0013.
experiment: capacity
base: configs/phase6_zumi.yaml
seed: 0
seeds: [60, 61, 62, 63, 64]
simulators: [rate]
workers: 10

capacity:
  vocab_sizes: [25, 60, 112]          # 112 = the 120 nimi pu minus 8 particles
  codings: [k2n20, onehot]           # chosen on selection seeds (ADR 0013): k2n20; one-hot as reference
  kc: [[16000, 850]]                  # chosen on selection seeds: [KC count, KC threshold]
  controls: [no_kc, shuffled]         # run at the largest vocabulary
  n_messages: 500                     # random sentences scored per run
  pn_active_frac: 0.15                # as the 7b-7f speaker
