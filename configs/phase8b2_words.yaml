# Phase 8b-2 B (ADR 0013): the grammar fly reads the words themselves, no classes (114 inputs).
# A measurement: how far table and corpus teaching get without the tokenizer's classes.
experiment: grammar8
base: configs/phase6_zumi.yaml
seed: 0
seeds: [90, 91, 92, 93, 94]
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

grammar8:                               # runs: [arch, teacher, stim, source, KCs, KC threshold, (corpus size)]
  inputs: words
  candidates:                           # table: every valid (state, word) transition (an upper bound: the table is built from the classes)
    - [single, "true", pair, table, 2000, 650]
    - [single, "true", pair, table, 16000, 650]
    - [single, "true", pair, table, 16000, 850]
  references:                           # learning from example sentences, each seen transition once per epoch
    - [single, "true", pair, dedup, 2000, 650, 500]
    - [single, "true", pair, dedup, 2000, 650, 2000]
    - [single, "true", pair, dedup, 2000, 650, 8000]
    - [single, "true", pair, dedup, 16000, 650, 500]
    - [single, "true", pair, dedup, 16000, 650, 2000]
    - [single, "true", pair, dedup, 16000, 650, 8000]
    - [single, "true", pair, dedup, 16000, 850, 500]
    - [single, "true", pair, dedup, 16000, 850, 2000]
    - [single, "true", pair, dedup, 16000, 850, 8000]
  conf_grid: [0.0, 0.01, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25]
  vocab: 112
  n_corpus: 500
  n_eval: 1000
  p_bare: 0.3
  p_mods: [0.5, 0.3, 0.2]
  p_object: 0.5
