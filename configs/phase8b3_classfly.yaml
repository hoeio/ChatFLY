# Phase 8b-3 (ADR 0013): 8b-2 A with KC thresholds and token densities for single-word stimuli.
# Phase 8b-2 A (ADR 0013): the tokenizer's word -> class step done by a fly (class fly), in
# series with 8b's grammar fly (fixed: its chosen run and threshold). The class fly's condition
# is chosen on select_seeds (dev split), then tested.
experiment: classfly
base: configs/phase6_zumi.yaml
seed: 0
seeds: [95, 96, 97, 98, 99]             # new test seeds
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

classfly:
  conds:                                # in tie order; 8b-2 A: 650 leaves single words silent
    - {n_kc: 2000, kc_theta: 450, balance: none}                        # 3 of 5 claws (the base default)
    - {n_kc: 2000, kc_theta: 550, balance: none}
    - {n_kc: 2000, kc_theta: 650, balance: none, pn_active_frac: 0.3}   # denser word tokens
    - {n_kc: 2000, kc_theta: 450, balance: class}
  controls: [no_kc, shuffled]
  grammar_run: [single, "true", pair, table, 2000, 650]   # 8b main run
  grammar_threshold: 0.1                                  # chosen in 8b

grammar8:                               # data as 8b
  vocab: 112
  n_corpus: 500
  n_eval: 1000
  p_bare: 0.3
  p_mods: [0.5, 0.3, 0.2]
  p_object: 0.5

gate:                                   # ADR 0013, set before the run; every test seed
  class_acc_min: 1.0                    # all 114 words
  utterance_acc_min: 0.99               # class fly -> grammar fly, closed loop
  control_utterance_acc_max: 0.90       # mean, each control
