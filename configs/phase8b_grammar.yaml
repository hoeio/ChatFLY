# Phase 8b (ADR 0013): the fly tracks the grammar of a Toki Pona subset (H2, H5).
# Selection (thresholds, main run) on select_seeds with the dev split; then the test seeds.
experiment: grammar8
base: configs/phase6_zumi.yaml
seed: 0
seeds: [90, 91, 92, 93, 94]             # test seeds (new)
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

grammar8:                               # runs: [arch, teacher, stim, source, KCs, KC threshold]; only valid transitions are taught
  candidates:                           # one fly, no routing: (state, word class) smelled together. In tie order:
    - [single, "true", pair, table, 2000, 650]        # fewer KCs first, then source table, dedup, table_bal, raw
    - [single, "true", pair, dedup, 2000, 650]
    - [single, "true", pair, table_bal, 2000, 650]
    - [single, "true", pair, raw, 2000, 650]
    - [single, "true", pair, table, 16000, 650]
    - [single, "true", pair, dedup, 16000, 650]
    - [single, "true", pair, table_bal, 16000, 650]
    - [single, "true", pair, raw, 16000, 650]
    - [single, "true", pair, table, 16000, 850]
    - [single, "true", pair, dedup, 16000, 850]
    - [single, "true", pair, table_bal, 16000, 850]
    - [single, "true", pair, raw, 16000, 850]
  references:
    - [routed_shared, "true", state, table, 2000, 650]  # 7c design: the word class selects the readout (router glue)
  conf_grid: [0.0, 0.01, 0.02, 0.05, 0.1, 0.15, 0.2, 0.25]  # below: dead (X)
  vocab: 112
  n_corpus: 500                         # training sentences (dedup / raw sources)
  n_eval: 1000                          # half valid sentences, half word salads
  p_bare: 0.3                           # subject mi or sina
  p_mods: [0.5, 0.3, 0.2]               # 0, 1, 2 modifiers per phrase
  p_object: 0.5

gate:                                   # ADR 0013, set before the run; main run, every test seed
  step_acc_min: 0.99                    # every (state, class) transition, X included via the threshold
  utterance_acc_min: 0.99               # final state, closed loop
  control_utterance_acc_max: 0.90       # mean, each control (single_pn, shuffled teacher)
