# Phase 8c (ADR 0013): does the memory fly keep facts about noun phrases with modifiers apart
# (H3)? Zumi 2's memory fly with a KC setting chosen on select_seeds; a phrase smells like the
# union of its words.
experiment: phrase_memory
base: configs/phase6_zumi.yaml
seed: 0
seeds: [100, 101, 102, 103, 104]        # new test seeds
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

phrase_memory:
  vocab: 112
  levels: [0, 1, 2]                     # modifiers per phrase
  n_heads: 10
  n_mods: 4                             # level 1: 10 heads x 4 shared modifiers = 40 phrases
  n_mods_b: 2                           # level 2: 10 heads x 2 x 2 shared modifiers = 40 phrases
  n_unknown: 10                         # level 0: never-taught words; levels 1-2: phrases with a never-used modifier
  n_props: 4                            # predicate words, each a yes/no output pair
  props_per_phrase: 2                   # facts per phrase (80 per level), values random
  threshold: 0.2                        # Zumi 2's chosen min_confidence (rate), unchanged
  conds:                                # memory fly KC setting, in tie order (seed 10: Zumi 2's 2000/450 gave level-1 0.49)
    - {n_kc: 2000, kc_theta: 450}
    - {n_kc: 2000, kc_theta: 650}
    - {n_kc: 16000, kc_theta: 650}
    - {n_kc: 16000, kc_theta: 850}
  controls: [no_kc, shuffled]

gate:                                   # ADR 0013, set before the run
  level1_correct_min: 0.95              # every test seed: answered with confidence >= 0.2 and right
  control_level1_correct_max: 0.80      # mean, each control
