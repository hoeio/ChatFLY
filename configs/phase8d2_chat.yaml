# Phase 8d-2 (ADR 0013): 8d with the memory fly unrouted: subject and predicate smelled together,
# one yes/no output pair (replaces the predicate -> output-pair routing). Memory KC setting chosen
# on select_seeds; the other flies as in 8d.
experiment: chat8d
base: configs/phase6_zumi.yaml
seed: 0
seeds: [110, 111, 112, 113, 114]        # new test seeds
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

chat8d:
  class_fly: {n_kc: 2000, kc_theta: 450, balance: class}          # 8b-3
  grammar_fly: {n_kc: 2000, kc_theta: 650, threshold: 0.1}        # 8b
  memory_fly: {n_kc: 16000, kc_theta: 850, threshold: 0.2, routing: none}  # 8c, unrouted
  memory_conds:                         # in tie order
    - {n_kc: 16000, kc_theta: 850}
    - {n_kc: 32000, kc_theta: 850}
    - {n_kc: 64000, kc_theta: 850}
  speaker: {coding: k2n20, n_pn: 150, pn_active_frac: 0.15, n_kc: 16000, kc_theta: 850, balance: state}  # 8a-3
  n_heads: 10
  n_mods: 4                             # 40 subjects (head + modifier), as 8c level 1
  n_preds: 4
  preds_per_subject: 2                  # 80 facts taught by statements
  controls: [memory_no_kc]

gate:                                   # ADR 0013, set before the run
  reply_exact_min: 0.95                 # every test seed, over all 120 questions (80 taught, 40 unknown)
  control_reply_exact_max: 0.80         # mean, each control
