# Phase 8e (ADR 0013): a whole Toki Pona conversation carried by flies: yes/no facts, object facts
# ("S li P e O"), yes/no and "what" questions ("S li P e seme?"), changes of mind, unknown subjects.
# The 8d flies keep their settings; the new object memory's setting is chosen on select_seeds.
experiment: chat8d
base: configs/phase6_zumi.yaml
seed: 0
seeds: [115, 116, 117, 118, 119]        # new test seeds
select_seeds: [10, 11, 12, 13, 14]
simulators: [rate]
workers: 10

chat8d:
  objects: true
  class_fly: {n_kc: 2000, kc_theta: 450, balance: class}          # 8b-3
  grammar_fly: {n_kc: 2000, kc_theta: 650, threshold: 0.1}        # 8b (8e grammar: 14 states)
  memory_fly: {n_kc: 16000, kc_theta: 850, threshold: 0.2}        # 8c / 8d (routed)
  speaker: {coding: k2n20, n_pn: 150, pn_active_frac: 0.15, n_kc: 16000, kc_theta: 850, balance: state}  # 8a-3
  object_memory: {coding: k2n20, n_kc: 16000, kc_theta: 850, n_teach: 5, threshold: 0.1}
  select:                               # object memory, in tie order
    key: object_memory
    conds:
      - {n_kc: 16000, threshold: 0.05}
      - {n_kc: 16000, threshold: 0.1}
      - {n_kc: 16000, threshold: 0.2}
      - {n_kc: 32000, threshold: 0.05}
      - {n_kc: 32000, threshold: 0.1}
      - {n_kc: 32000, threshold: 0.2}
  n_heads: 10
  n_mods: 4                             # 40 subjects
  n_preds: 4                            # yes/no predicates
  n_object_preds: 2                     # predicates that take an object
  n_objects: 8
  n_turns: 300
  p_turn: [0.3, 0.2, 0.2, 0.2, 0.1]     # teach yes/no, teach object, ask yes/no, ask what, ask about an unknown subject
  controls: [memory_no_kc, speaker_no_kc]   # memory_no_kc: both memory flies without KC layer

gate:                                   # ADR 0013, set before the run
  reply_exact_min: 0.95                 # every test seed, all questions
  control_reply_exact_max: 0.80         # mean, each control
