[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatfly"
version = "0.0.1"
description = "Connectome-based digital fly (mushroom body) language learning and chat interface"
requires-python = ">=3.13"  # brian2 2.11 needs 3.13 (ADR 0003)
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
sim = ["brian2>=2.11"]
connectome = ["pyarrow"]  # reads the FlyWire .feather files (Phase 3)
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatfly = ["web.html"]  # demo page served by chatfly.web

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
